<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stajyer Görev Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; color: #333; }
        .container { margin-top: 50px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .btn-success { background-color: #1f4037; border: none; padding: 12px; }
        .btn-success:hover { background-color: #152d27; }
        .table thead { background-color: #f8f9fa; }
        .form-control { border-radius: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="container">
        <h3 class="fw-bold mb-4">Görev Yönetim Paneli</h3>
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">Yeni Görev Tanımla</h5>
                    <form id="gorevFormu" novalidate>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Görev Başlığı</label>
                            <input type="text" class="form-control" id="baslik" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small">Açıklama</label>
                            <textarea class="form-control" id="aciklama" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">KAYDET</button>
                    </form>
                    <div id="formSonuc" class="mt-3"></div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">Aktif Görev Listesi</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Başlık</th>
                                    <th>Açıklama</th>
                                    <th>Durum</th>
                                </tr>
                            </thead>
                            <tbody id="gorevTablosu"></tbody>
                        </table>
                    </div>
                    <div id="listeSonuc" class="mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
